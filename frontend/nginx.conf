server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Filled in at container start from /etc/resolv.conf so Nginx can boot
    # before the backend service exists. The hostname is resolved per request.
    resolver __RESOLVER__ valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /metrics {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
