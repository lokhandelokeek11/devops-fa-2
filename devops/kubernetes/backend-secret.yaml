apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: smart-campus
type: Opaque
stringData:
  # Replace this before you deploy. Copy the URI from Supabase:
  # Project Settings -> Database -> Connection string -> URI
  # Do not commit the real password.
  DATABASE_URL: postgresql://postgres.YOUR_PROJECT_REF:YOUR_PASSWORD@aws-0-YOUR_REGION.pooler.supabase.com:6543/postgres
  DATABASE_SSL: "true"
