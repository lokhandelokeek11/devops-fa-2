apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: smart-campus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: smart-campus-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - backend.smart-campus.svc.cluster.local:5000
            labels:
              service: smart-campus-backend
